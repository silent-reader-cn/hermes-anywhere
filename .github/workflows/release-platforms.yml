name: Release Platforms

# 为已发布版本补齐非 Windows / Android 平台包（Linux tar.gz / macOS .app zip）。
#
# 为什么放 CI：本机是 Windows，`flutter build linux` 必须有 Linux 宿主、
# `flutter build macos` 必须有 macOS 宿主，本地编不出来（docs/QA.md 记的
# 「macOS / Linux / Web 平台目录已生成，构建链路未验证」就是这一块）。
#
# 用法：
#   gh workflow run release-platforms.yml --ref main -f tag=v0.1.74 -f dry_run=true
#   ① dry_run=true 只构建 + 传 artifact（不动 Release），用于校验包内容；
#   ② 确认后 dry_run=false 再把资产直挂目标 Release（--clobber 幂等可重跑）。
#
# 构建源码取的是**目标 tag**，保证产物与已发布版本同码。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 Release tag（源码取该 tag，资产挂到它）'
        required: true
        default: 'v0.1.74'
      only:
        description: "只编某个平台：both / linux / macos（省钱用，publish 需 both）"
        required: true
        default: 'both'
      dry_run:
        description: 'true = 只构建并上传 artifact，不挂 Release'
        required: true
        default: 'true'

concurrency:
  group: release-platforms-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  linux:
    if: ${{ inputs.only != 'macos' }}
    runs-on: ubuntu-22.04 # 22.04 而非 24.04：glibc 2.35，能多覆盖一批发行版
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # 原生依赖按 linux/flutter/generated_plugin_registrant.cc 的插件清单来：
      # libsecret-1（flutter_secure_storage_linux）/ libjsoncpp（同上）/
      # libayatana-appindicator3（tray_manager）/ libkeybinder-3.0（hotkey_manager_linux）/
      # libmpv-dev + libepoxy-dev（media_kit_video 的 linux/CMakeLists.txt 直接
      # pkg_check_modules(mpv|epoxy)，缺则 CMake Generate 阶段就失败：Target
      # "media_kit_video_plugin" links to PkgConfig::mpv but the target was not found）
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev \
            libmpv-dev libepoxy-dev patchelf \
            xvfb libgl1-mesa-dri libglu1-mesa mesa-utils

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build linux release
        run: |
          flutter --version
          flutter pub get
          flutter build linux --release

      # 为什么必须自带 mpv：`libmedia_kit_video_plugin.so` 的 DT_NEEDED 是**写死的
      # `libmpv.so.1`**（本次构建机 = Ubuntu 22.04 的 libmpv1），而 Ubuntu 24.04 /
      # Debian 12 起只提供 `libmpv.so.2` ⇒ 不自带就是「在常见新发行版上启动即失败」。
      # 只拷「非桌面栈」的那部分：glibc / X11 / GTK / GL / glib / pango 这类必须沿用
      # 发行版自己的（混装才会坏）；媒体栈（libav* / libsw* / libass / libplacebo /
      # libx264 …）由包内提供。
      # 另：Flutter 给 runner 挂的是 DT_**RUNPATH**（不传递给二级依赖），所以包内媒体库
      # 之间必须用 `--force-rpath` 改回可传递的 DT_RPATH，否则 libmpv 找不到同目录的
      # libavcodec —— 这正是「② 隐藏系统库」那步要抓的。
      - name: Bundle libmpv closure into the bundle
        run: |
          set -u
          BUNDLE=build/linux/x64/release/bundle
          BLOCK='^lib(c|m|dl|pthread|rt|stdc\+\+|gcc_s|resolv|util|nsl|gomp|z|mimalloc)\.so|^lib(X11|X11-xcb|Xext|Xv|Xrandr|Xinerama|Xcursor|Xfixes|Xrender|Xau|Xdmcp|Xss|Xtst|Xi|Xpresent|Xxf86vm|Xcomposite|Xdamage|xcb[0-9A-Za-z-]*|xkbcommon[0-9A-Za-z-]*|wayland[0-9A-Za-z-]*|drm|gbm|EGL|GL|GLX|GLdispatch|OpenGL|glapi|vulkan|gtk-3|gdk-3|glib-2\.0|gobject-2\.0|gio-2\.0|gmodule-2\.0|atk-1\.0|pango-1\.0|pangocairo-1\.0|cairo|harfbuzz|fontconfig|freetype|epoxy|secret-1|dbus-1|systemd|udev|asound|pulse|selinux|pcre2|ffi|mount|blkid|uuid|gcrypt|gpg-error)\.so'

          copy_closure() {
            for lib in $(ldd "$1" 2>/dev/null | awk '/=>/ {print $3}'); do
              [ -e "$lib" ] || continue
              name=$(basename "$lib")
              if echo "$name" | grep -Eq "$BLOCK"; then continue; fi
              [ -e "$BUNDLE/lib/$name" ] && continue
              cp -L "$lib" "$BUNDLE/lib/"
              echo "  + $name"
              copy_closure "$BUNDLE/lib/$name"
            done
          }

          MPV=$(ldd "$BUNDLE/lib/libmedia_kit_video_plugin.so" | awk '/libmpv/ {print $3}')
          echo "系统 libmpv: $MPV"
          echo "--- 补丁前：插件与 libmpv 的动态段 ---"
          readelf -d "$BUNDLE/lib/libmedia_kit_video_plugin.so" | grep -E "RPATH|RUNPATH|NEEDED" || true
          readelf -d "$MPV" | grep -E "RPATH|RUNPATH" || true

          # ⚠️ 根文件必须单独拷：copy_closure 只递归「依赖」，不会拷传入的那个文件本身
          # （首版就栽在这里 —— ffmpeg 栈全进了包，独独缺 libmpv.so.1，② 一藏系统库就 127）
          cp -L "$MPV" "$BUNDLE/lib/$(basename "$MPV")"
          echo "  + $(basename "$MPV")"
          copy_closure "$MPV"

          # 同目录内的媒体库互解析：rpath 必须可传递
          for so in "$BUNDLE"/lib/*.so; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$so"
          done
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$BUNDLE/hermes_ui"

          # 硬断言：缺了就等于又发一个「在用户机上升不起来」的包
          for must in libmpv.so.1 libavcodec.so.58 libavformat.so.58 libavutil.so.56; do
            if [ ! -f "$BUNDLE/lib/$must" ]; then
              echo "::error::自足性检查未过：bundle/lib 缺 $must"
              exit 1
            fi
          done

          echo "--- 补丁后：插件动态段 ---"
          readelf -d "$BUNDLE/lib/libmedia_kit_video_plugin.so" | grep -E "RPATH|RUNPATH" || true
          echo "--- bundle/lib 里所有 .so 的未解析依赖（应为空）---"
          for so in "$BUNDLE"/lib/*.so; do
            miss=$(ldd "$so" 2>/dev/null | grep "not found" || true)
            if [ -n "$miss" ]; then echo "$so:"; echo "$miss"; fi
          done
          echo "--- 包内媒体库 ---"
          ls "$BUNDLE/lib" | grep -E "mpv|avcodec|avformat|avutil|swscale|swresample|ass|placebo|x264|x265" || true
          du -sh "$BUNDLE/lib"

      # 软判据：CI 无显示服务器，只能靠 Xvfb + 软件 GL 起一次。
      # EXIT=124（被 timeout 收走）＝ 存活满 25s ＝ PASS；非 0/非 124 要人工看日志。
      # ② 是「包自足性」取证：把系统 libmpv 藏起来再跑 —— 仍 PASS 才说明包换机器能跑。
      - name: Smoke run under Xvfb (best effort, non-blocking)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          run_smoke() {
            xvfb-run -a -s "-screen 0 1280x720x24" \
              timeout -s TERM 25 build/linux/x64/release/bundle/hermes_ui > "$1" 2>&1
            echo $?
          }
          echo "=== ① 常规环境 ==="
          code=$(run_smoke /tmp/linux-smoke.log)
          echo "EXIT=$code  (124 = 存活满 25s = PASS)"
          cat /tmp/linux-smoke.log
          echo "=== ② 隐藏系统媒体库后（自足性取证）==="
          sudo mkdir -p /tmp/mpv-hidden
          for pat in libmpv.so* libavcodec.so* libavformat.so* libavutil.so* libavfilter.so* \
                     libswscale.so* libswresample.so* libpostproc.so* libass.so* libplacebo.so* \
                     libx264.so* libx265.so* libdav1d.so* libvpx.so* libopus.so* libvorbis.so* \
                     libmp3lame.so* libtheora.so* libwebp.so* libsixel.so* libuchardet.so* \
                     libzimg.so* libluajit.so* libdvdnav.so* libdvdread.so* libbluray.so* \
                     libsrt.so* libssh.so* libsmbclient.so* libzvbi.so*; do
            sudo mv /usr/lib/x86_64-linux-gnu/$pat /tmp/mpv-hidden/ 2>/dev/null || true
          done
          echo "已藏起 $(ls /tmp/mpv-hidden | wc -l) 个系统库"
          code2=$(run_smoke /tmp/linux-smoke-nompv.log)
          echo "EXIT=$code2  (124 = 包自带媒体栈也活满 25s = PASS)"
          cat /tmp/linux-smoke-nompv.log
          sudo mv /tmp/mpv-hidden/* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true

      - name: Package tar.gz
        run: |
          VER="${{ inputs.tag }}"; VER="${VER#v}"
          OUT="HermesAnywhere-${VER}-linux-x64.tar.gz"
          tar -czf "$OUT" -C build/linux/x64/release/bundle .
          sha256sum "$OUT" > "$OUT.sha256"
          echo "--- bundle 内容（前 30 行）---"
          tar -tzf "$OUT" | head -30
          ls -l "$OUT" "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-pkg
          path: |
            HermesAnywhere-*-linux-x64.tar.gz
            HermesAnywhere-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

  macos:
    if: ${{ inputs.only != 'linux' }}
    runs-on: macos-latest # Apple Silicon（arm64）；未签名，用户侧需 xattr -cr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build macos release
        run: |
          flutter --version
          flutter pub get
          flutter build macos --release

      # 软判据：runner 上没有真实窗口会话时这条可能失败，不代表包坏（只看日志定性）。
      - name: Smoke run (best effort, non-blocking)
        continue-on-error: true
        run: |
          BIN=build/macos/Build/Products/Release/hermes_ui.app/Contents/MacOS/hermes_ui
          "$BIN" > /tmp/macos-smoke.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "ALIVE after 20s = PASS"; kill "$PID" || true
          else
            wait "$PID"; echo "EXITED early, code=$?"
          fi
          echo "--- smoke log ---"
          cat /tmp/macos-smoke.log

      - name: Package zip
        run: |
          VER="${{ inputs.tag }}"; VER="${VER#v}"
          OUT="HermesAnywhere-${VER}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/hermes_ui.app "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          ls -l "$OUT" "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            HermesAnywhere-*-macos-arm64.zip
            HermesAnywhere-*-macos-arm64.zip.sha256
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    if: ${{ inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release upload "${{ inputs.tag }}" dist/* --clobber

      - name: Read back assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ inputs.tag }}" --json assets \
            -q '.assets[]|"\(.name)  \(.size) B  \(.state)"'
